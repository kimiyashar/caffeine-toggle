name: CaffeineToggle
options:
  bundleIdPrefix: com.kimiyashar
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: 9NTP754TX2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
targets:
  CaffeineToggle:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "*.entitlements"
      - path: Shared
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Caffeine Toggle
        CFBundleShortVersionString: "3.0.1"
        CFBundleVersion: "15"
        LSUIElement: true
        NSHighResolutionCapable: true
    entitlements:
      path: App/CaffeineToggle.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kimiyashar.CaffeineToggle.MenuBarApp
        PRODUCT_NAME: Caffeine Toggle
        EXECUTABLE_NAME: CaffeineToggle
        CODE_SIGN_ENTITLEMENTS: App/CaffeineToggle.entitlements
    dependencies:
      - sdk: IOKit.framework
  CaffeineToggleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Shared
      - path: App/ClamshellController.swift
      - path: App/MenuBarSettings.swift
      - path: App/ScheduleSettings.swift
      - path: App/SingleInstanceLock.swift
    dependencies:
      - sdk: IOKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kimiyashar.CaffeineToggle.Tests
        CODE_SIGNING_ALLOWED: NO
